<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simon Says Game</title>
</head>
<body>

    <h1>Simon Says</h1>
    <h2>Press any key to start the game</h2>

    <div class="btn-container">
        <div class="line-one">
         <div class="btn btn-one" type="button" id="btn-one"></div>
        <div class="btn btn-two" type="button" id="btn-two"></div>  
     </div>
        <div class="line-two">
        <div class="btn btn-three" type="button" id="btn-three"></div>
        <div class="btn btn-four" type="button" id="btn-four"></div></div>
    </div>

    <script src="app.js"></script>
</body> 
</html>
